name: CI

# Every pull request and every push to main: lint, type check, unit tests,
# build of the plugin, and a build of the image for amd64 and arm64 (not
# pushed). The release workflow runs the same checks before a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      - name: Unit tests
        run: npm test # CI=true on GitHub runners: vitest runs once

      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: git diff --exit-code -- .

      - name: Keep the built plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangar-headlamp-plugin
          path: |
            plugin/dist/main.js
            plugin/package.json
          if-no-files-found: error

  image:
    name: Image builds (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The final stage only copies files (no RUN): no emulation is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PLUGIN_VERSION=ci
          push: false
          provenance: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
