name: CI

# Every pull request and every push to main: lint, type check, unit tests,
# build of the plugin, the cluster bundles, builds of the plugin and guest
# bridge images for amd64 and arm64 (not pushed), the guest bridge's Go
# checks, and a smoke test of its bundle on kind. The release workflow runs
# the same checks before a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      - name: Unit tests
        run: npm test # CI=true on GitHub runners: vitest runs once

      - name: Build
        run: npm run build

      - name: Generated files are committed
        run: git diff --exit-code -- .

      - name: Keep the built plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangar-headlamp-plugin
          path: |
            plugin/dist/main.js
            plugin/package.json
          if-no-files-found: error

  bridge:
    name: Guest bridge (vet, tests, govulncheck, amd64 and arm64 builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain line of bridge/go.mod decides the Go version.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # The API server test runs two bridges behind a real kube-apiserver
      # and etcd (envtest), whose binaries it downloads.
      - name: Tests
        env:
          HANGAR_ENVTEST_DOWNLOAD: v1.36.2
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Static builds for amd64 and arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -o "${RUNNER_TEMP}/hangar-guest-bridge-$arch" ./cmd/hangar-guest-bridge
          done

  bundles:
    name: Cluster bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The files the release attaches for distributions (k4all): the
      # runner's kubectl builds the node agent and the guest bridge with
      # kustomize.
      - name: Build hangar-cluster.yaml, hangar-node-agent.yaml and hangar-guest-bridge.yaml
        run: .github/scripts/cluster-bundles.sh "${RUNNER_TEMP}/bundles"

  image:
    name: Image builds (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The final stage only copies files (no RUN): no emulation is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PLUGIN_VERSION=ci
          push: false
          provenance: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  bridge-image:
    name: Guest bridge image builds (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The builder's Go is bridge/go.mod's toolchain
        run: |
          want="$(sed -n 's/^toolchain go//p' bridge/go.mod)"
          have="$(sed -n 's/^ARG GO_VERSION=//p' Containerfile.bridge)"
          if [ "${want}" != "${have}" ]; then
            echo "::error::Containerfile.bridge builds with Go ${have}, bridge/go.mod wants ${want}"
            exit 1
          fi

      # The builder cross-compiles on the runner's platform and the final
      # stage only copies the binary: no emulation is needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile.bridge
          platforms: linux/amd64,linux/arm64
          build-args: |
            BRIDGE_VERSION=ci
          push: false
          provenance: false
          cache-from: type=gha,scope=bridge-image
          cache-to: type=gha,mode=max,scope=bridge-image

  bridge-e2e:
    name: Guest bridge bundle on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (amd64, into Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile.bridge
          platforms: linux/amd64
          build-args: |
            BRIDGE_VERSION=e2e
          push: false
          load: true
          provenance: false
          tags: localhost/hangar-guest-bridge:e2e
          cache-from: type=gha,scope=bridge-e2e
          cache-to: type=gha,mode=max,scope=bridge-e2e

      # Only kind itself: the script makes its own cluster.
      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true

      - name: Smoke test
        run: .github/scripts/bridge-e2e.sh localhost/hangar-guest-bridge:e2e
