# Hangar node agent: one pod per host.
#
# - "agent" (privileged): binds the PCI devices Hangar gives to VMs to
#   vfio-pci, which KubeVirt needs, keeps a udev rule so they stay bound
#   after a reboot, and writes the host's hardware inventory (PCI, SR-IOV,
#   mediated devices, USB, disks, who holds what) to a shared emptyDir.
#   It has no Kubernetes API access: its desired state is the ConfigMap
#   hangar-passthrough (one key per host, one PCI address per line), which
#   Hangar writes.
# - "http" (unprivileged, read-only): serves that inventory file. Hangar
#   reads it through the API server: pods/proxy on this namespace.
#
# Apply with `kubectl apply -k` on this directory (the scripts become a
# ConfigMap). See ../../README.md, "Host devices".
apiVersion: v1
kind: Namespace
metadata:
  name: hangar-system
  labels:
    app.kubernetes.io/part-of: hangar
    # The agent container is privileged.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hangar-node-agent
  labels:
    app.kubernetes.io/name: hangar-node-agent
    app.kubernetes.io/part-of: hangar
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hangar-node-agent
  labels:
    app.kubernetes.io/name: hangar-node-agent
    app.kubernetes.io/part-of: hangar
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hangar-node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hangar-node-agent
        app.kubernetes.io/part-of: hangar
    spec:
      serviceAccountName: hangar-node-agent
      automountServiceAccountToken: false
      # To see which qemu process (VM) holds which device.
      hostPID: true
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: docker.io/library/busybox:1.37.0-musl
          command: ["sh", "/scripts/agent.sh", "run"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: desired
              mountPath: /config
              readOnly: true
            - name: inventory
              mountPath: /run/hangar
            - name: host-sys
              mountPath: /host/sys
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: udev-rules
              mountPath: /host/etc/udev/rules.d
            - name: state
              mountPath: /host/var/lib/hangar
            - name: hwdata
              mountPath: /hwdata
              readOnly: true
        - name: http
          image: docker.io/library/busybox:1.37.0-musl
          command: ["httpd", "-f", "-p", "8095", "-h", "/www"]
          ports:
            - name: inventory
              containerPort: 8095
          readinessProbe:
            httpGet:
              path: /inventory.json
              port: inventory
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: inventory
              mountPath: /www
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: hangar-node-agent-scripts
            defaultMode: 0555
        - name: desired
          configMap:
            # Written by Hangar; absent until the first device is given to VMs.
            name: hangar-passthrough
            optional: true
        - name: inventory
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: udev-rules
          hostPath:
            path: /etc/udev/rules.d
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/hangar
            type: DirectoryOrCreate
        - name: hwdata
          # pci.ids and usb.ids for device names (Fedora, CoreOS, RHEL, Debian: hwdata).
          hostPath:
            path: /usr/share/hwdata
